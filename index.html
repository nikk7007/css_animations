<!DOCTYPE html>
<html lang="pt-Br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animacoes CSS</title>
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <h1>Animações</h1>
  </header>
  <main>
    <section id="gallery">
      
      
      <div class="card">
        <p class="name">Basic button</p>
        <button class="basic"><span>Button</span></button>
      </div>
      
      <div class="card">
        <p class="name">Bubbles button</p>
        <button class="bubbles"><span>Button</span></button>
      </div>
      
      <div class="card">
        <p class="name">Slice button</p>
        <button class="slice"><span>Button</span></button>
      </div>
      
      <div class="card">
        <p class="name">Ball button</p>
        <button class="ball"><span>Button</span></button>
      </div>
      
      <div class="card">
        <p class="name">Ball button 2</p>
        <button class="ball2"><span>Button</span></button>
      </div>
      
      <div class="card">
        <p class="name">Foldy button</p>
        <button class="foldy"><span>Button</span></button>
      </div>
      
      <div class="card">
        <p class="name">Foldy 2 button</p>
        <button class="foldy2"><span>Button</span></button>
      </div>
      
      <div class="card">
        <p class="name">Checkbox</p>
        <label class="itemCheck">
          <input type="checkbox" id="item1"/>
          <div class="checkmark"></div>
          <label for="item1">Item 1</label>
        </label>
      </div>
      
    </section>
  </main>
  
</body>
</html>
